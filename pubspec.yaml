name: digirider
description: "A new Flutter project."
publish_to: "none"
version: 1.0.7+12

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  lottie: ^3.3.1
  slide_to_act: ^2.0.2
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  google_sign_in: ^6.3.0
  file_picker: ^10.2.0
  http_parser: ^4.1.2
  permission_handler: ^12.0.0+1
  intl: ^0.20.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  pdf: ^3.10.4
  printing: ^5.11.0
  qr_flutter: ^4.1.0
  font_awesome_flutter: ^10.8.0
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^19.2.1
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.0.0
  open_file: ^3.2.1
  google_maps_flutter: ^2.2.8
  geolocator: ^9.0.2
  geocoding: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_gen: ^5.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/Icons/
    - assets/animation/
    - assets/images/
    - assets/images/app_icon.png
  fonts:
    - family: bevan
      fonts:
        - asset: assets/fonts/sans.ttf
    - family: bold
      fonts:
        - asset: assets/fonts/PTSerif-Bold.ttf
